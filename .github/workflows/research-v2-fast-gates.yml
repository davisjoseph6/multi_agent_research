name: Research V2 fast gates (fictional only)
on:
  pull_request:
    paths:
      - 'agent2_realdata_benchmark/src/prototype/research_v2_*.py'
      - 'agent2_realdata_benchmark/tests/test_research_v2_*.py'
      - 'agent2_realdata_benchmark/scripts/research_v2_preflight.py'
      - 'agent2_realdata_benchmark/scripts/research_v2_fulljourney_smoke.py'
      - '.github/workflows/research-v2-fast-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-v2-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agent2_realdata_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure test dependencies
        run: python -m pip install pytest==9.1.1
      - name: Run transactional and bilingual V2 unit tests
        run: >
          python -m pytest -q
          tests/test_research_v2_proposal.py
          tests/test_research_v2_preflight.py
          tests/test_research_v2_reminder_outbox.py
          tests/test_research_v2_crossover_fixture.py
          tests/test_research_v2_fulljourney_smoke.py
          tests/test_research_v2_mastery_trace.py
      - name: Assert genuine study release stays blocked
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          p = subprocess.run(
              [sys.executable, "-m", "scripts.research_v2_preflight"],
              capture_output=True, text=True, check=False,
          )
          assert p.returncode == 2, p.stderr
          data = json.loads(p.stdout)
          assert data["result"] == "BLOCKED_NOT_APPROVED"
          assert not data["human_enrollment_authorized"]
          assert not data["changes_to_vps_services"]
          print("V2 release correctly BLOCKED; pure synthetic regression suite passed.")
          PY

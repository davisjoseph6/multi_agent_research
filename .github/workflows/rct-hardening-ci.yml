name: RCT rehearsal QA
on:
  push:
    branches: [feature/rct-production-hardening-20261031, feature/rct-https-staging-20261101]
  pull_request:
    paths:
      - 'agent2_realdata_benchmark/**'
      - 'docs/index.html'
      - '.github/workflows/rct-hardening-ci.yml'
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent2_realdata_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent2_realdata_benchmark/requirements-prototype.txt
      - name: Install pinned rehearsal dependencies
        run: python -m pip install -r requirements-prototype.txt
      - name: Validate Python and exact candidate
        run: |
          python -m pytest -q tests/test_rct_candidate.py tests/test_rct_arm_a_demo.py tests/test_rct_resource_diagnostic.py tests/test_rct_planner_probe.py tests/test_rct_recovery_gallery.py tests/test_rct_questionnaire_scales.py tests/test_rct_content_review_packet.py tests/test_rct_operational_load.py tests/test_rct_restore_drill.py
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Fail closed if preview appears to collect participant data
        run: python -m scripts.rct_public_preview_check

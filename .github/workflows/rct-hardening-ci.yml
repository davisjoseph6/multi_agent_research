name: RCT rehearsal QA
on:
  push:
    branches: [feature/rct-production-hardening-20261031, feature/rct-https-staging-20261101]
  pull_request:
    paths:
      - 'agent2_realdata_benchmark/**'
      - 'docs/index.html'
      - '.github/workflows/rct-hardening-ci.yml'
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent2_realdata_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent2_realdata_benchmark/requirements-prototype.txt
      - name: Install pinned rehearsal dependencies
        run: python -m pip install -r requirements-prototype.txt
      - name: Validate Python and exact candidate
        run: |
          python -m pytest -q tests/test_rct_candidate.py tests/test_rct_arm_a_demo.py tests/test_rct_resource_diagnostic.py tests/test_rct_operator_demo.py tests/test_rct_planner_probe.py tests/test_rct_recovery_gallery.py tests/test_rct_questionnaire_scales.py tests/test_rct_content_review_packet.py tests/test_rct_operational_load.py tests/test_rct_restore_drill.py
      # Two legacy tests require local-only research artifacts absent on
      # GitHub runners: ASSIST2009 processed/split data (5 tests) and the
      # external NeuralCD reference model (1 test). Do not call this "full".
      - name: Report unavailable legacy research fixtures
        run: |
          echo "::warning title=Legacy test coverage excluded::ASSIST2009 frozen splits (5) and external NeuralCD comparison (1) are not supplied on cloud runners; the local 1,354-test result is separately recorded. This CI job exercises the complete self-contained suite only."
          test ! -f data/processed/assist2009/interactions.parquet || echo "ASSIST2009 locally present; full-suite validation still requires reference-model data"
      - name: Run self-contained regression suite (six external-fixture tests excluded)
        run: >
          python -m pytest -q
          --ignore=tests/test_assist2009_splits.py
          -k "not test_reference_forward_equivalence"
      - name: Assert the published pilot release index remains blocked
        run: |
          python - <<'PY'
          from src.prototype.pilot_release_evidence_gate import inspect_evidence_index
          from pathlib import Path
          path = Path("../docs/pilot_release_evidence/MANIFEST_TEMPLATE.json")
          report = inspect_evidence_index(path)
          assert report["result"] == "BLOCKED_MISSING_EVIDENCE"
          assert report["gates_complete"] == 0
          assert report["gates_required"] == 14
          assert not report["human_enrollment_authorized"]
          print("The public pilot evidence template fails closed: 0/14 gates.")
          PY
      - name: Fail closed if preview appears to collect participant data
        run: python -m scripts.rct_public_preview_check

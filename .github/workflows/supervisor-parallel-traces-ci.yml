name: Supervisor 2026-11-11 parallel RCT trace acceptance
on:
  push:
    branches:
      - research/ijcai2027-supervisor-parallel-protocol-20261111
    paths:
      - 'agent2_realdata_benchmark/data/supervisor_20261111/**'
      - 'agent2_realdata_benchmark/src/prototype/supervisor_*.py'
      - 'agent2_realdata_benchmark/src/prototype/templates/supervisor_research_monitor.html'
      - 'agent2_realdata_benchmark/src/prototype/static/supervisor_research_monitor.*'
      - 'agent2_realdata_benchmark/scripts/supervisor_research_monitor_wsgi.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_operational_neural_cli.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_content_approval_template.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_operational_backup_cli.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_fictional_browser.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_gdpr_admin.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_daily_job.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_consent_pdf.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_neural_rehearsal.py'
      - 'agent2_realdata_benchmark/src/prototype/templates/supervisor_fictional_web.html'
      - 'agent2_realdata_benchmark/src/prototype/static/supervisor_fictional_web.*'
      - 'agent2_realdata_benchmark/tests/test_supervisor_*.py'
      - 'agent2_realdata_benchmark/tests/test_supervisor_vps_*.py'
      - 'agent2_realdata_benchmark/ops/supervisor/**'
      - 'agent2_realdata_benchmark/scripts/supervisor_vps_*.py'
      - 'agent2_realdata_benchmark/content/consent/**'
      - '.github/workflows/supervisor-parallel-traces-ci.yml'
  pull_request:
    paths:
      - 'agent2_realdata_benchmark/data/supervisor_20261111/**'
      - 'agent2_realdata_benchmark/src/prototype/supervisor_*.py'
      - 'agent2_realdata_benchmark/src/prototype/templates/supervisor_research_monitor.html'
      - 'agent2_realdata_benchmark/src/prototype/static/supervisor_research_monitor.*'
      - 'agent2_realdata_benchmark/scripts/supervisor_research_monitor_wsgi.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_operational_neural_cli.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_content_approval_template.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_operational_backup_cli.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_fictional_browser.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_gdpr_admin.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_daily_job.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_consent_pdf.py'
      - 'agent2_realdata_benchmark/scripts/supervisor_neural_rehearsal.py'
      - 'agent2_realdata_benchmark/src/prototype/templates/supervisor_fictional_web.html'
      - 'agent2_realdata_benchmark/src/prototype/static/supervisor_fictional_web.*'
      - 'agent2_realdata_benchmark/tests/test_supervisor_*.py'
      - 'agent2_realdata_benchmark/tests/test_supervisor_vps_*.py'
      - 'agent2_realdata_benchmark/ops/supervisor/**'
      - 'agent2_realdata_benchmark/scripts/supervisor_vps_*.py'
      - 'agent2_realdata_benchmark/content/consent/**'
      - '.github/workflows/supervisor-parallel-traces-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trace-oracle:
    name: Offline exact 465-step reference acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agent2_realdata_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone test framework
        run: python -m pip install pytest==9.1.1 Flask==3.1.3 reportlab==4.4.9 cryptography
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check for staged Socratic browser
        run: node --check src/prototype/static/supervisor_fictional_web.js
          node --check src/prototype/static/supervisor_fictional_copy.js
      - name: Check production-structured client JavaScript syntax
        run: |
          node --check src/prototype/static/supervisor_vps.js
          node --check src/prototype/static/supervisor_research_monitor.js
          bash -n ops/supervisor/enable_researcher_dashboard.sh
          node --check src/prototype/static/supervisor_fictional_web.js
          node --check src/prototype/static/supervisor_fictional_copy.js
          bash -n ops/supervisor/install_staging.sh
          bash -n ops/supervisor/run_safe_encrypted_backup.sh
          bash -n ops/supervisor/test_release_directory_access.sh
      - name: Reproduce and fix the 200/CHDIR failure as a second Linux user
        run: sudo bash ops/supervisor/test_release_directory_access.sh
      - name: Exactly compare all supervisor scenarios and bank constraints
        run: python -m pytest -q tests/test_supervisor_20261111_traces.py tests/test_supervisor_20261111_store.py tests/test_supervisor_20261111_end_to_end_store.py tests/test_supervisor_20261111_reminders.py tests/test_supervisor_20261111_fictional_http.py tests/test_supervisor_20261111_neural.py tests/test_supervisor_20261111_model_comparison.py tests/test_supervisor_20261111_backup.py tests/test_supervisor_20261112_consent_gdpr.py tests/test_supervisor_20261112_consent_web.py tests/test_supervisor_20261112_gdpr_admin.py tests/test_supervisor_20261112_daily_operations.py tests/test_supervisor_20261112_recovery_quick_demo.py tests/test_supervisor_20261112_french_feedback.py tests/test_supervisor_vps_staging.py tests/test_supervisor_vps_scheduler.py tests/test_supervisor_vps_install_permissions.py tests/test_supervisor_vps_credential_rotation.py tests/test_supervisor_invitation_lifecycle_audit.py tests/test_supervisor_research_monitor.py tests/test_supervisor_reward_consent.py tests/test_supervisor_operational_neural.py tests/test_supervisor_signed_content_release.py tests/test_supervisor_operational_backup.py tests/test_supervisor_study_auth_isolation.py tests/test_supervisor_backup_wrapper.py
      - name: Create and validate versioned English/French Annex PDFs
        run: |
          python -m scripts.supervisor_consent_pdf
          python - <<'PY'
          from pathlib import Path
          for lang in ('en','fr'):
              p=Path('content/consent')/f'info_sheet_{lang}_v1.0.pdf'
              assert p.read_bytes().startswith(b'%PDF-') and p.stat().st_size > 1500
          print('Both versioned information sheet PDFs generated and verified.')
          PY
      - name: Print unresolved neural feature contract (no torch needed)
        run: python -m scripts.supervisor_neural_rehearsal --feature-contract
      - name: Verify all canonical CSV files are present
        run: |
          python - <<'PY'
          from src.prototype.supervisor_content import SupervisorBank
          b=SupervisorBank('data/supervisor_20261111')
          print('screening',len(b.forms['screening']))
          print('pretest',len(b.forms['pretest']))
          print('practice',len(b.forms['practice']))
          print('posttest',len(b.forms['posttest']))
          print('content sha256',b.sha256)
          assert (len(b.forms['screening']),len(b.forms['pretest']),
                  len(b.forms['practice']),len(b.forms['posttest'])) == (
                      8,16,192,16)
          PY

  browser-smoke:
    name: Real Chromium fictional recovery UI walkthrough
    # Playwright 1.56.1 bundles supported Chromium binaries for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent2_realdata_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated fictional browser dependencies
        run: |
          python -m pip install Flask==3.1.3 reportlab==4.4.9
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run a real browser through the four Group A recovery screens
        run: node scripts/supervisor_browser_playwright.cjs
      - name: Full A/B/C end-to-end 3-session English/French Chromium journey
        run: node scripts/supervisor_three_arm_browser_playwright.cjs
      - name: Operational /study/ real-browser A/B/C onboarding and session-one acceptance
        run: node scripts/supervisor_vps_browser_playwright.cjs
      - name: Researcher-only live BKT dashboard in real Chromium
        run: node scripts/supervisor_research_monitor_playwright.cjs
